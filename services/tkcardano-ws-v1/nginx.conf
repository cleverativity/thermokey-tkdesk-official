user www-data;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # CapRover terminates TLS and sends X-Forwarded-* to the container.
    # Do not overwrite those values with local $scheme (http) or Swagger/API URLs break.
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $http_x_forwarded_host $proxy_x_forwarded_host {
        default $http_x_forwarded_host;
        ''      $host;
    }

    upstream dotnet_app {
        server 127.0.0.1:5001;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Forward the full request path (/stag/api/v1/..., /stag/swagger/...) unchanged.
        location / {
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization, Content-Length, X-Environment' always;
            add_header 'Access-Control-Max-Age' 86400 always;

            # Handle preflight requests
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://dotnet_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
            proxy_set_header Authorization $http_authorization;
            proxy_cache_bypass $http_upgrade;

            # PDF / thermal calculations can take 20+ seconds
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
