# This "input" configures a global authorization rule to enable public access to
# all models in this schema. Learn more about authorization rules here: https://docs.amplify.aws/cli/graphql/authorization-rules

# input AMPLIFY {
#   globalAuthRule: AuthRule = { allow: public }
# } # FOR TESTING ONLY!

type RealTimeCallback
  @model
  @auth(rules: [{ allow: public }, { allow: private }]) {
  id: ID!
  code: String!
  data: String!
  type: RealTimeCallbackType!
}

type MenuNotification
  @model
  @auth(rules: [{ allow: public }, { allow: private }]) {
  id: ID!
  count: Int!
  createdAt: AWSDateTime
}

enum RealTimeCallbackType {
  downloadUpdate
  downloadSelectionsPdfUpdate
  fanModelImportUpdate
}

type Subscription {
  onCreateRealTimeCallbackByCode(code: String!): RealTimeCallback
    @aws_subscribe(mutations: ["createRealTimeCallback"])

  onUpdateMenuNotificationByCode(id: String!): MenuNotification
    @aws_subscribe(mutations: ["updateMenuNotification"])
}
